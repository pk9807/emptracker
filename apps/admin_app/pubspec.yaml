name: admin_app
description: Production-grade Responsive Admin Live Tracking & Operations Dashboard.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  models:
    path: ../../packages/models
  design_system:
    path: ../../packages/design_system
  services:
    path: ../../packages/services
  firebase_repository:
    path: ../../packages/firebase_repository
  map_engine:
    path: ../../packages/map_engine
  google_maps_flutter: ^2.10.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
